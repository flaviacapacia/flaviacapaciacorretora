<script>
const SEU_NUMERO = "5548999600601";
const LINK_WHATSAPP = "https://wa.me/" + SEU_NUMERO;
const ARQUIVO_CONHECIMENTO = "conhecimento.json";

// 🧠 DADOS CARREGADOS DO ARQUIVO
let baseConhecimento = {};

// 📊 ESTADO DA CONVERSA
let estado = {
  assunto: null,
  etapa: 0,
  respostas: [],
  perfil: { bairro: "", valor: "" }
};

// ✅ CARREGAR CONHECIMENTO DO ARQUIVO
async function carregarConhecimento() {
  try {
    const resposta = await fetch(ARQUIVO_CONHECIMENTO);
    baseConhecimento = await resposta.json();
    console.log("✅ Conhecimento carregado");
  } catch (erro) {
    console.log("⚠️ Erro ao carregar, usando padrão");
    baseConhecimento = {
      repo_base: "https://github.com/flaviacapacia/flaviacapaciacorretora/blob/main/",
      site_base: "https://flaviacapaciacorretora.com/",
      imoveis_cadastrados: []
    };
  }
}

// 🔍 BUSCAR IMÓVEIS NO GITHUB
function buscarImoveisNoPerfil(perfil) {
  const bairro = (perfil.bairro || "").toLowerCase();
  const imoveis = baseConhecimento.imoveis_cadastrados || [];
  const repoBase = baseConhecimento.repo_base || "";
  const siteBase = baseConhecimento.site_base || "";

  // Filtra imóveis pelo bairro informado
  const encontrados = imoveis.filter(imovel => {
    const bairroImovel = (imovel.bairro || "").toLowerCase();
    return bairroImovel.includes(bairro) || bairro.includes(bairroImovel);
  });

  if (encontrados.length === 0) {
    return "Encontrei ótimas opções para você! Vou te encaminhar com os detalhes.";
  }

  // Monta lista com links diretos
  let lista = "Encontrei imóveis compatíveis com o seu perfil:\n\n";
  encontrados.forEach(imovel => {
    const linkSite = `${siteBase}${imovel.arquivo}`;
    lista += `🏠 ${imovel.titulo}\n🔗 Ver detalhes e fotos: ${linkSite}\n\n`;
  });

  return lista;
}

// === ABRIR E FECHAR AGENTE ===
const botao = document.getElementById('botaoAgente');
const janela = document.getElementById('janelaAgente');
const fechar = document.getElementById('fecharAgente');

botao.addEventListener('click', () => janela.classList.toggle('aberta'));
fechar.addEventListener('click', () => {
  janela.classList.remove('aberta');
  estado = { assunto: null, etapa: 0, respostas: [], perfil: { bairro: "", valor: "" } };
});

// === ADICIONAR MENSAGEM NA TELA ===
function adicionarMensagem(texto, tipo = 'assistente') {
  const caixa = document.getElementById('caixaMensagens');
  const div = document.createElement('div');
  div.className = 'mensagem ' + tipo;
  div.innerHTML = texto.replace(/\n/g, '<br>');
  caixa.appendChild(div);
  caixa.scrollTop = caixa.scrollHeight;
}

// === MONTAR RESUMO E ENVIAR COM LINKS ===
async function finalizarColeta() {
  const fluxo = baseConhecimento[estado.assunto];
  if (!fluxo) return;

  // Monta resumo das respostas
  const resumo = [];
  fluxo.perguntas.forEach((pergunta, indice) => {
    resumo.push(`${pergunta}\n→ ${estado.respostas[indice] || "Não informado"}`);
  });

  // Busca imóveis compatíveis
  const listaImoveis = buscarImoveisNoPerfil(estado.perfil);

  // Texto completo para WhatsApp
  const textoCompleto = `Olá Flávia! Tenho interesse em: ${fluxo.descricao.split(".")[0]}.

${resumo.join("\n\n")}

---
${listaImoveis}
Por favor, me envie mais informações e condições. Obrigado(a)!`;

  // Mostra mensagem final com botão
  adicionarMensagem(`✅ Perfil coletado! Encontrei opções compatíveis com o que você procura. Clique abaixo para ver os imóveis e falar comigo diretamente.
    <br><a href="${LINK_WHATSAPP}?text=${encodeURIComponent(textoCompleto)}" target="_blank" class="link-whatsapp">📋 Ver Imóveis e Detalhes</a>`);

  // Reinicia conversa
  estado = { assunto: null, etapa: 0, respostas: [], perfil: { bairro: "", valor: "" } };
}

// === PROCESSAR RESPOSTA DO CLIENTE ===
function processarResposta(respostaTexto) {
  const fluxo = baseConhecimento[estado.assunto];
  if (!fluxo) return;

  estado.respostas.push(respostaTexto);
  estado.etapa++;

  // Guarda bairro e valor para busca
  const texto = respostaTexto.toLowerCase();
  if (texto.includes("são josé") || texto.includes("sao jose")) {
    estado.perfil.bairro = "São José";
  } else if (estado.etapa === 1) {
    estado.perfil.bairro = respostaTexto;
  }
  if (texto.includes("mil") || texto.includes("R$") || texto.includes("até")) {
    estado.perfil.valor = respostaTexto;
  }

  // Faz próxima pergunta ou finaliza
  if (estado.etapa < fluxo.perguntas.length) {
    setTimeout(() => {
      adicionarMensagem(`<strong>${fluxo.perguntas[estado.etapa]}</strong>`);
    }, 700);
  } else {
    setTimeout(finalizarColeta, 700);
  }
}

// === INICIAR FLUXO ===
function iniciarFluxo(chave) {
  if (chave === 'atendimento') {
    adicionarMensagem(`Claro! Fale diretamente comigo pelo WhatsApp.
      <br><a href="${LINK_WHATSAPP}" target="_blank" class="link-whatsapp">💬 Falar Agora</a>`);
    return;
  }

  estado.assunto = chave;
  const fluxo = baseConhecimento[chave];
  if (!fluxo) return;

  estado.etapa = 0;
  estado.respostas = [];
  estado.perfil = { bairro: "", valor: "" };

  adicionarMensagem(`${fluxo.descricao}<br><br><strong>${fluxo.perguntas[0]}</strong>`);
}

// === CLIQUE NAS OPÇÕES ===
document.querySelectorAll('.agente-opcao').forEach(botao => {
  botao.addEventListener('click', () => {
    const opcao = botao.dataset.opcao;
    const textos = {
      studio: "Quero saber sobre studios",
      airbnb: "Quero imóveis para Airbnb",
      lancamento: "Quero lançamentos na planta",
      troca: "Quero trocar meu imóvel",
      casasjose: "Busco casa em São José",
      atendimento: "Quero falar com a Flávia"
    };
    adicionarMensagem(textos[opcao] || opcao, 'usuario');
    setTimeout(() => iniciarFluxo(opcao), 600);
  });
});

// === CAMPO DE DIGITAÇÃO ===
document.getElementById('enviarMensagem').addEventListener('click', () => {
  const texto = document.getElementById('entradaUsuario').value.trim();
  if (!texto) return;

  adicionarMensagem(texto, 'usuario');
  document.getElementById('entradaUsuario').value = '';

  // Reconhece busca por São José digitada livremente
  if (texto.toLowerCase().includes("são josé") || texto.toLowerCase().includes("sao jose")) {
    estado.assunto = "casasjose";
    estado.perfil.bairro = "São José";
  }

  if (estado.assunto) {
    processarResposta(texto);
  } else {
    setTimeout(() => {
      adicionarMensagem("Escolha uma das opções acima ou me diga o que você procura! Ex: 'busco casa em São José'");
    }, 600);
  }
});

// === ENVIAR COM TECLA ENTER ===
document.getElementById('entradaUsuario').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('enviarMensagem').click();
});

// === FORMULÁRIO E BOTÕES DE IMÓVEIS ===
document.getElementById('leadForm').addEventListener('submit', e => {
  e.preventDefault();
  const nome = document.getElementById('nome').value;
  const tel = document.getElementById('telefone').value;
  const assunto = document.getElementById('assunto').value;
  const msg = document.getElementById('mensagem').value;
  const texto = `Olá Flávia! Me chamo ${nome}, meu WhatsApp é ${tel}.%0AQuero saber sobre: ${assunto}.%0A${msg}`;
  window.open(`${LINK_WHATSAPP}?text=${encodeURIComponent(texto)}`, '_blank');
});

function enviarWhatsapp(imovel) {
  window.open(`${LINK_WHATSAPP}?text=${encodeURIComponent(`Olá Flávia, gostaria de mais detalhes sobre: ${imovel}`)}`, '_blank');
}

// 🚀 INICIAR CARREGANDO O CONHECIMENTO
carregarConhecimento();
</script>
